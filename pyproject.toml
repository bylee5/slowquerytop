[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slowquerytop"
version = "0.1.0"
description = "Anemometer-style slow query analyzer for SQL Server (Query Store / DMV) and MySQL slow logs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "pyodbc>=5.0",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
slowquerytop = "slowquerytop.cli:main"

[tool.setuptools.packages.find]
include = ["slowquerytop*"]

[tool.setuptools.package-data]
"slowquerytop.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
