<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}slowquerytop{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/chart.umd.min.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/report?ds={{ ui.ds }}">slowquery<b>top</b></a>
  <nav>
    <a href="/report?ds={{ ui.ds }}&view=table">Report</a>
    <a href="/report?ds={{ ui.ds }}&view=graph">Graph</a>
    <a href="/api/docs">API</a>
  </nav>
  <form class="ds-switch" method="get" action="/report">
    <label for="ds-select">Datasource</label>
    <select id="ds-select" name="ds" onchange="this.form.submit()">
      {% for name, ds in datasources.items() %}
      <option value="{{ name }}" {% if name == ui.ds %}selected{% endif %}>{{ ds.label }}</option>
      {% endfor %}
    </select>
  </form>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>slowquerytop {{ version }} · times shown in {{ tzname }}</footer>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
